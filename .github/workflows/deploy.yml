name: Deploy HostingBeyond

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-hostingbeyond-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy HostingBeyond to VPS
        uses: appleboy/ssh-action@v1.2.0
        env:
          ORBIT_KEY: "713304977"
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT }}
          envs: ORBIT_KEY
          script_stop: true
          command_timeout: 15m
          script: |
            set -euo pipefail

            echo "==> Deploying HostingBeyond only"
            echo "==> Target: /var/www/hostingbeyond"
            echo "==> PM2 process: hostingbeyond"

            cd /var/www/hostingbeyond

            echo "==> Syncing to origin/main (preserve .env)"
            git fetch origin main
            git checkout main
            git reset --hard origin/main
            git clean -fd -e .env -e .env.local -e .env.production -e public/uploads

            echo "==> Safety checks"
            pwd
            test "$(pwd)" = "/var/www/hostingbeyond"
            test -f .env && echo "ENV_PRESENT" || echo "ENV_MISSING_WARNING"

            echo "==> Ensuring Orbit env (HostingBeyond .env only)"
            touch .env
            awk '!/^ORBIT_ENROLLMENT_SECRET=/' .env > .env.hb.tmp
            mv .env.hb.tmp .env
            echo "ORBIT_ENROLLMENT_SECRET=${ORBIT_KEY}" >> .env
            grep -q '^ORBIT_SESSION_SECRET=' .env || echo 'ORBIT_SESSION_SECRET=hb_orbit_prod_session_secret_v1' >> .env
            awk '!/^ORBIT_RP_ID=/' .env > .env.hb.tmp && mv .env.hb.tmp .env
            echo 'ORBIT_RP_ID=beyond.theglobalorbit.com' >> .env
            awk '!/^ORBIT_ORIGIN=/' .env > .env.hb.tmp && mv .env.hb.tmp .env
            echo 'ORBIT_ORIGIN=https://beyond.theglobalorbit.com' >> .env
            echo "ORBIT_ENV_READY"

            echo "==> Installing dependencies"
            npm install

            echo "==> Prisma generate + migrate deploy (HostingBeyond DB only)"
            npx prisma generate
            npx prisma migrate deploy

            echo "==> Building production bundle"
            npm run build

            echo "==> Restarting ONLY PM2 process: hostingbeyond on PORT 3005"
            PORT=3005 pm2 restart hostingbeyond --update-env || PORT=3005 pm2 start npm --name hostingbeyond -- start
            pm2 save || true

            echo "==> PM2 status for hostingbeyond"
            pm2 describe hostingbeyond

            echo "==> HostingBeyond deploy completed on VPS"

      - name: Verify live site
        run: |
          set -euo pipefail

          echo "==> Verifying https://beyond.theglobalorbit.com"
          sleep 5
          HTTP_CODE="$(curl -fsS -o /tmp/hostingbeyond-verify.html -w "%{http_code}" --retry 8 --retry-delay 3 --retry-all-errors https://beyond.theglobalorbit.com)"

          if [ "$HTTP_CODE" != "200" ]; then
            echo "Deployment verification failed: expected HTTP 200, got ${HTTP_CODE}"
            exit 1
          fi

          if ! grep -qi "HostingBeyond\|HOSTINGBEYOND\|Everything You Need\|translate-y-\\[4px\\]" /tmp/hostingbeyond-verify.html; then
            echo "Deployment verification failed: expected homepage content was not found"
            exit 1
          fi

          echo "==> Verification passed (HTTP ${HTTP_CODE})"
